<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ツッコミ漫才ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--page:#ffd21f;--dots:rgba(22,18,16,.13);--ink:#161210;--ink-soft:#4a3b2c;
--paper:#fffdf6;--line:#161210;--shadow:#161210;--soft:#fff1b8;--veil:rgba(255,210,31,.86);
--hud:#161210;--hud-ink:#fffdf6;--hud-num:#ffd21f;
--accent:#e8312a;--accent-ink:#fffdf6;--sign-ink:#ffd21f;
--stage-top:#3b1613;--stage-bottom:#1c0b09;--spot:rgba(255,224,150,.30);
--curtain:#b3221c;--curtain-deep:#7a1013;--fringe:#ffd21f;--floor-top:#a8692f;--floor-bottom:#6b3d17;
--bubble:#fffdf6;--bubble-ink:#161210;--bubble-line:#161210;
--zone-just:#22b765;--zone-late:#ffb300;--zone-ok:#ff7a1a;--zone-slow:#e8412f;
--great:#e8312a;--good:#ff8a00;--ok:#1fa85e;--weak:#3f7ae0;--miss:#8a8a8a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
--page:#17132b;--dots:rgba(255,255,255,.06);--ink:#fff6e0;--ink-soft:#c8bedf;
--paper:#262042;--line:#f3e9cf;--shadow:#000000;--soft:#2f2852;--veil:rgba(23,19,43,.88);
--hud:#0d0a1c;--hud-ink:#fff6e0;--hud-num:#ffd21f;
--accent:#ff4b3e;--accent-ink:#17132b;
--stage-top:#2a0f0d;--stage-bottom:#0c0504;--spot:rgba(255,224,150,.22);
--curtain:#9a1d18;--curtain-deep:#5c0b0e;--fringe:#e5b417;--floor-top:#7d4d22;--floor-bottom:#3f230d;
--bubble-line:#000000}}
:root[data-theme="dark"]{color-scheme:dark;
--page:#17132b;--dots:rgba(255,255,255,.06);--ink:#fff6e0;--ink-soft:#c8bedf;
--paper:#262042;--line:#f3e9cf;--shadow:#000000;--soft:#2f2852;--veil:rgba(23,19,43,.88);
--hud:#0d0a1c;--hud-ink:#fff6e0;--hud-num:#ffd21f;
--accent:#ff4b3e;--accent-ink:#17132b;
--stage-top:#2a0f0d;--stage-bottom:#0c0504;--spot:rgba(255,224,150,.22);
--curtain:#9a1d18;--curtain-deep:#5c0b0e;--fringe:#e5b417;--floor-top:#7d4d22;--floor-bottom:#3f230d;
--bubble-line:#000000}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background-color:var(--page);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.7px);background-size:9px 9px;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{position:relative;height:100%;min-height:540px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 12px 10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* 得点ボード */
.hud{background:var(--hud);color:var(--hud-ink);border:2.5px solid var(--line);border-radius:14px;padding:6px 12px 8px;box-shadow:0 3px 0 var(--shadow)}
.hud-row{display:flex;align-items:center;gap:12px}
.stat{display:flex;flex-direction:column;min-width:56px;line-height:1.15}
.stat .lbl{font-size:11px;font-weight:700;opacity:.7}
.stat b{display:inline-block;font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.stat.score{flex:1;align-items:center}
.stat.score b{font-size:25px;color:var(--hud-num)}
.stat b.bump{animation:bump .3s ease-out}
.mute{border:0;background:none;font-size:20px;line-height:1;padding:6px;cursor:pointer}
.laugh{display:flex;align-items:center;gap:8px;margin-top:4px}
.laugh .lbl{font-size:11px;font-weight:700;opacity:.7;white-space:nowrap}
.meter{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden}
.meter i{display:block;width:30%;height:100%;border-radius:5px;background:var(--hud-num);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}

/* 舞台 */
.stage{position:relative;flex:1 1 auto;min-height:240px;border:3px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 4px 0 var(--shadow);
background:radial-gradient(ellipse 62% 55% at 50% 74%,var(--spot),transparent 72%),linear-gradient(180deg,var(--stage-top),var(--stage-bottom))}
.stage.shake{animation:shake .32s linear}
.valance{position:absolute;left:0;right:0;top:0;height:30px;z-index:7;pointer-events:none;
background:radial-gradient(circle at 50% 0,var(--curtain) 0 13px,var(--fringe) 13.5px 15.5px,transparent 16px) 0 12px/30px 18px repeat-x,linear-gradient(180deg,var(--curtain-deep),var(--curtain)) 0 0/100% 13px no-repeat}
.drape{position:absolute;top:0;bottom:0;width:52%;z-index:6;pointer-events:none;transition:transform .9s cubic-bezier(.65,0,.3,1);
background:repeating-linear-gradient(90deg,var(--curtain-deep) 0 5px,var(--curtain) 5px 21px,var(--curtain-deep) 21px 27px)}
.drape.l{left:0;transform:translateX(calc(-100% + 12px))}
.drape.r{right:0;transform:translateX(calc(100% - 12px))}
.stage.closed .drape{transform:translateX(0)}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 32% 62%,rgba(255,255,255,.7),transparent 62%)}
.flash.on{animation:flash .5s ease-out}
.mekuri{position:absolute;right:16px;bottom:30px;z-index:2;max-height:58%;padding:9px 0;width:30px;background:#fffdf6;color:#161210;border:2px solid #161210;border-radius:3px;box-shadow:2px 2px 0 rgba(0,0,0,.45);writing-mode:vertical-rl;text-orientation:upright;font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:13px;line-height:26px;letter-spacing:.06em;overflow:hidden;pointer-events:none}

/* ふきだし */
.bubbles{position:absolute;left:0;right:0;top:36px;z-index:3;padding:0 22px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);border:2.5px solid var(--bubble-line);border-radius:16px;box-shadow:3px 3px 0 var(--bubble-line);padding:9px 12px;font-weight:700;font-size:clamp(15px,4.3vw,18px);line-height:1.45;transition:opacity .15s,transform .15s}
.bubble p{margin:0;white-space:pre-line;min-height:1.45em}
.bubble.boke{align-self:flex-start;max-width:94%;min-width:60%}
.bubble.boke p{min-height:2.9em}
.bubble.tsuk{align-self:flex-end;max-width:82%;min-width:40%;transform-origin:85% 100%}
.bubble .who{position:absolute;top:-10px;left:10px;padding:3px 8px;border-radius:8px;background:var(--bubble-line);color:var(--bubble);font-size:10.5px;font-weight:900;line-height:1}
.bubble.tsuk .who{left:auto;right:10px}
.bubble::after{content:"";position:absolute;bottom:-8.5px;width:14px;height:14px;background:var(--bubble);border-right:2.5px solid var(--bubble-line);border-bottom:2.5px solid var(--bubble-line);transform:rotate(45deg)}
.bubble.boke::after{left:28px}
.bubble.tsuk::after{right:28px}
.bubble.hide{opacity:0;transform:translateY(6px) scale(.97)}
.bubble.say{animation:say .28s cubic-bezier(.2,.9,.3,1.4)}

/* 演者 */
.performers{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:3%;padding:0 14px;margin-bottom:-8px}
.char{height:calc(clamp(100px,19vh,168px) * var(--h,1));width:auto;overflow:visible;transform-origin:50% 100%}
.mic{height:clamp(84px,16vh,146px);width:auto;overflow:visible}
.char .bob{transform-box:view-box;transform-origin:60px 176px}
.char .eyes{transform-box:view-box;transform-origin:60px 52px;animation:blink 4.6s infinite}
.tsuk-char .eyes{animation-delay:-2.1s}
.char .mouth-open{display:none}
.char.open .mouth-open{display:inline}
.char.open .mouth-closed{display:none}
.char .arm{transform-box:view-box;transform-origin:23px 97px}
.char .garm{transform-box:view-box;transform-origin:98px 95px}
.char.off-l{transform:translateX(-190%)}
.char.off-r{transform:translateX(190%)}
.char.walk{transition:transform 3s cubic-bezier(.3,.55,.35,1)}
.char.walk-out{transition:transform 2s cubic-bezier(.55,0,.75,.5)}
.char.walk .bob,.char.walk-out .bob{animation:stepbob .3s ease-in-out infinite}
.char.talking .bob{animation:talknod .5s ease-in-out infinite}
.char.lunge{animation:lunge .42s ease-out}
.char.lunge .arm{animation:swing .42s ease-out}
.char.hit{animation:hit .4s ease-out}
.char.hit-big{animation:hitbig .55s ease-out}
.char.bow{animation:bow 1.1s ease-in-out}

/* 芸風ごとの動き */
.stage[data-move="tennen"] .boke-char.talking .bob{animation:sway 1.4s ease-in-out infinite}
.stage[data-move="tennen"] .boke-char.walk .bob{animation:skip .34s ease-in-out infinite}
.stage[data-move="tennen"] .char.walk{transition-duration:3.2s}
.stage[data-move="tennen"] .boke-char.hit-big{animation:daze .7s ease-out}
.stage[data-move="sassy"] .boke-char.talking .bob{animation:smug 1.6s ease-in-out infinite}
.stage[data-move="sassy"] .boke-char.hit-big{animation:shrug .6s ease-out}
.stage[data-move="mach"] .char.talking .bob{animation:jitter .16s steps(2) infinite}
.stage[data-move="mach"] .char.walk{transition-duration:1.5s}
.stage[data-move="mach"] .char.walk-out{transition-duration:1s}
.stage[data-move="mach"] .char.walk .bob,.stage[data-move="mach"] .char.walk-out .bob{animation-duration:.16s}
.stage[data-move="mach"] .boke-char.hit-big{animation:flail .45s linear}
.stage[data-move="deadpan"] .boke-char.talking .bob{animation:none}
.stage[data-move="deadpan"] .char.walk{transition:transform 3.8s linear}
.stage[data-move="deadpan"] .boke-char.walk .bob,.stage[data-move="deadpan"] .boke-char.walk-out .bob{animation:none}
.stage[data-move="deadpan"] .boke-char.hit,.stage[data-move="deadpan"] .boke-char.hit-big{animation:nohit .5s ease-out}
.stage[data-move="deadpan"] .boke-char .eyes{animation-duration:7s}
.stage[data-move="logic"] .boke-char.talking .garm{animation:point 1.3s ease-in-out infinite}
.stage[data-move="logic"] .char.walk{transition-duration:3.2s}
.stage[data-move="logic"] .boke-char.hit-big{animation:hit .45s ease-out}
.stage[data-move="fufu"] .boke-char.talking .garm{animation:wave .8s ease-in-out infinite}
.stage[data-move="fufu"] .char.walk{transition-duration:3.8s}
.stage[data-move="fufu"] .char.walk .bob,.stage[data-move="fufu"] .char.walk-out .bob{animation-duration:.45s}
.stage[data-move="fufu"] .boke-char.hit,.stage[data-move="fufu"] .boke-char.hit-big{animation:giggle .6s ease-out}

.floor{position:relative;z-index:1;height:38px;background:linear-gradient(180deg,var(--floor-top),var(--floor-bottom))}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.22)}
.audience{position:absolute;left:0;right:0;bottom:-4px;z-index:5;display:flex;justify-content:space-around;padding:0 16px;font-size:clamp(18px,5.4vw,24px);line-height:1;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.audience span{display:inline-block}
.audience span.jump{animation:jump .5s ease-out}
.audience span.jump2{animation:jump .42s ease-out 2}

/* 描き文字・評価 */
.sfx{position:absolute;z-index:8;left:5%;bottom:calc(clamp(100px,19vh,168px) + 22px);font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:clamp(22px,7vw,32px);line-height:1;white-space:nowrap;color:var(--c,#fff);opacity:0;pointer-events:none;
text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 3px 0 #fff,3px 0 0 #fff,0 -3px 0 #fff,-3px 0 0 #fff,0 6px 0 rgba(0,0,0,.4)}
.sfx.show{animation:sfx .75s ease-out}
.popup{position:absolute;left:50%;top:60%;z-index:8;width:92%;text-align:center;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
.popup.show{animation:pop 1.3s cubic-bezier(.2,.9,.3,1.2) forwards}
.popup .rank{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:clamp(42px,14vw,66px);line-height:1;color:var(--rank-color,#fff);
text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 3px 0 #fff,3px 0 0 #fff,0 -3px 0 #fff,-3px 0 0 #fff,0 8px 0 rgba(0,0,0,.35)}
.popup .pts{margin-top:4px;font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.6)}
.popup .note{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:10px;background:rgba(0,0,0,.7);color:#fff;font-weight:900;font-size:13.5px}
.popup .hint{width:max-content;max-width:100%;margin:5px auto 0;padding:3px 10px;border-radius:10px;background:rgba(18,112,62,.94);color:#fff;font-weight:900;font-size:13.5px}
.popup [hidden]{display:none}
.apop{position:absolute;right:5%;top:47%;z-index:8;text-align:right;pointer-events:none;opacity:0}
.apop.show{animation:apop 1s ease-out forwards}
.apop .r{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:clamp(22px,7vw,30px);line-height:1;color:var(--rank-color,#fff);
text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 2px 0 #fff,2px 0 0 #fff,0 -2px 0 #fff,-2px 0 0 #fff,0 5px 0 rgba(0,0,0,.35)}
.apop .n{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12.5px;font-weight:900}

/* 操作エリア */
.controls{display:flex;flex-direction:column;gap:7px}
.cue{min-height:22px;text-align:center;font-weight:900;font-size:15px;line-height:1.45;color:var(--ink-soft)}
.cue span{display:inline-block;padding:0 12px;border-radius:999px}
.cue.go span{background:var(--accent);color:var(--accent-ink);animation:cuepop .3s cubic-bezier(.2,.9,.3,1.5)}
.timer{position:relative;height:18px;border:2px solid var(--line);border-radius:9px;background:var(--soft)}
.zones{display:flex;height:100%;border-radius:7px;overflow:hidden}
.z{display:flex;align-items:center;justify-content:center;height:100%;opacity:.45;overflow:hidden;transition:opacity .15s}
.z[data-label]::after{content:attr(data-label);font-size:10.5px;font-weight:900;line-height:1;color:#fff;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.timer.on .z{opacity:1}
.z.g{background:var(--zone-just)}
.z.y{background:var(--zone-late)}
.z.o{background:var(--zone-ok)}
.z.r{background:var(--zone-slow)}
.needle{position:absolute;top:-6px;bottom:-6px;left:0;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px var(--page)}
.pad{position:relative}
.idle{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:15px;color:var(--ink-soft)}
.pad[data-mode="none"] .idle{display:flex}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;visibility:hidden}
.pad[data-mode="opts"] .opts{visibility:visible}
.aiz,.finale{position:absolute;inset:0;display:none}
.pad[data-mode="aiz"] .aiz,.pad[data-mode="finale"] .finale{display:block}
.opt{position:relative;min-height:60px;padding:8px;border:2.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--shadow);font-weight:900;font-size:clamp(14px,4.1vw,17px);line-height:1.25;cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s,opacity .15s,background-color .15s,border-color .15s}
.opt.armed{opacity:.85}
.opt.live{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.opt:not(.locked):active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.opt.locked{opacity:.5;cursor:default}
.opt.best{opacity:1;background:var(--zone-just);border-color:var(--zone-just);color:#fff}
.opt.picked{opacity:1;outline:3px solid var(--accent);outline-offset:2px}
.aiz button{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:0 6px 0 var(--shadow);cursor:pointer;touch-action:manipulation;transition:background-color .12s,border-color .12s,box-shadow .12s,transform .06s}
.aiz small{font-size:12px;font-weight:900;color:var(--ink-soft)}
.aiz b{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:clamp(28px,9vw,40px);line-height:1.15}
.aiz button:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
.aiz button.live{border-color:var(--accent);box-shadow:0 6px 0 var(--accent)}
.aiz button.pressed{background:var(--soft)}
.aiz button.hit{background:var(--zone-just);border-color:var(--zone-just);color:#fff}
.aiz button.meh{background:var(--zone-late);border-color:var(--zone-late);color:#161210}
.aiz button.bad{background:var(--miss);border-color:var(--miss);color:#fff}
.aiz button.hit small,.aiz button.bad small{color:#fff}
.aiz button.meh small{color:#161210}
.finale button{width:100%;height:100%;border:3px solid var(--line);border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 var(--shadow);font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:clamp(30px,10vw,44px);cursor:pointer;touch-action:manipulation}
.finale button.armed{opacity:.85}
.finale button.locked{opacity:.5}
.finale button.pressed{opacity:1}
.finale button.live{animation:pulse .5s ease-in-out infinite alternate}
.finale button:active{animation:none;transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}

/* タイトル・コンビ選び・結果 */
.overlay{position:absolute;inset:0;z-index:20;display:flex;padding:14px;overflow-y:auto;background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
.panel{width:100%;max-width:420px;margin:auto;padding:22px 16px 18px;border:3px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);box-shadow:6px 6px 0 var(--shadow);text-align:center}
.panel p{margin:0}
.sign{display:inline-block;margin:2px 0 14px;padding:6px 16px 8px;border:3px solid var(--line);background:var(--accent);color:var(--sign-ink);box-shadow:5px 5px 0 var(--shadow);transform:rotate(-3deg);font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:clamp(36px,11vw,50px);line-height:1.1}
.lead{margin:0 0 10px!important;font-size:15px;font-weight:700;line-height:1.7}
.howto{margin:0 0 12px;text-align:left}
.howto summary{cursor:pointer;list-style:none;text-align:center;font-size:14px;font-weight:900;color:var(--ink-soft)}
.howto summary::-webkit-details-marker{display:none}
.howto summary::after{content:" ▾"}
.howto[open] summary::after{content:" ▴"}
.rules{margin:8px 0 0;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:13px;line-height:1.7;text-align:left}
.rules p + p,.rules .chips + p{margin-top:6px}
.rules .chips{margin-top:8px}
.pick{margin:2px 0 8px!important;font-size:14px;font-weight:900}
.combos{display:flex;flex-direction:column;gap:10px;text-align:left}
.combo{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:2.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--shadow);cursor:pointer;touch-action:manipulation;text-align:left}
.combo:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.sw{display:flex;flex:none}
.sw i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--cc)}
.sw i + i{margin-left:-9px;background:var(--cc2)}
.cb{display:flex;flex-direction:column;gap:3px;min-width:0}
.cn{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:18px;line-height:1.2}
.cm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;font-weight:900}
.tag{padding:1px 8px;border-radius:999px;background:var(--soft)}
.lv{color:var(--accent);letter-spacing:.06em}
.cd{font-size:12.5px;font-weight:700;line-height:1.5;color:var(--ink-soft)}
.cs{font-size:11.5px;font-weight:900;color:var(--ink-soft)}
.g{display:inline-block;padding:0 6px;border-radius:6px;background:var(--zone-just);color:#fff;font-weight:900;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.chip{padding:3px 9px;border-radius:999px;background:var(--c);color:var(--ci,#fff);font-size:12px;font-weight:900}
.big{display:block;width:100%;padding:14px;border:3px solid var(--line);border-radius:16px;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--shadow);font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:21px;cursor:pointer;touch-action:manipulation}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.big.ghost{background:var(--paper);color:var(--ink)}
.btns{display:flex;flex-direction:column;gap:12px}
.best-line{margin-top:12px!important;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.done{font-size:13px;font-weight:700;color:var(--ink-soft)}
.honor{margin:8px 0 0;font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400;font-size:clamp(24px,8vw,32px);line-height:1.2;color:var(--accent)}
.big-score{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-size:clamp(46px,15vw,62px);line-height:1.1;font-variant-numeric:tabular-nums}
.big-score small{margin-left:4px;font-size:.4em}
.new{display:inline-block;margin:4px 0 8px!important;padding:3px 12px;border-radius:999px;background:var(--hud-num);color:#161210;font-size:13px;font-weight:900}
.rec{margin:4px 0 8px!important;font-size:13px;font-weight:700;color:var(--ink-soft)}
.row-label{margin:8px 0 4px!important;font-size:12.5px;font-weight:900;color:var(--ink-soft)}
.sub{margin:12px 0 16px!important;font-size:13.5px;font-weight:700;color:var(--ink-soft)}

@keyframes bump{40%{transform:scale(1.22)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes say{0%{transform:scale(.75)}100%{transform:scale(1)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes stepbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes skip{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes talknod{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes smug{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-2deg) translateY(-1px)}}
@keyframes jitter{0%{transform:translate(0,0)}50%{transform:translate(1.5px,-1.5px)}}
@keyframes point{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-138deg)}}
@keyframes wave{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-62deg)}}
@keyframes lunge{0%,100%{transform:none}30%{transform:translateX(-16px) rotate(-5deg)}}
@keyframes swing{0%,100%{transform:rotate(0deg)}28%{transform:rotate(120deg)}}
@keyframes hit{0%,100%{transform:none}35%{transform:translateX(-6px) rotate(-6deg)}}
@keyframes hitbig{0%,100%{transform:none}28%{transform:translateX(-16px) rotate(-15deg)}60%{transform:translateX(-3px) rotate(4deg)}}
@keyframes daze{0%,100%{transform:none}30%{transform:translateX(-10px) rotate(-12deg)}60%{transform:rotate(9deg)}}
@keyframes shrug{0%,100%{transform:none}35%{transform:translateY(-5px) rotate(4deg)}}
@keyframes flail{0%,100%{transform:none}20%{transform:translateX(-14px) rotate(-10deg)}40%{transform:translateX(-6px) rotate(6deg)}60%{transform:translateX(-12px) rotate(-6deg)}80%{transform:translateX(-3px) rotate(3deg)}}
@keyframes nohit{0%,100%{transform:none}40%{transform:translateX(-1.5px)}}
@keyframes giggle{0%,100%{transform:none}25%{transform:translateY(-6px)}50%{transform:none}75%{transform:translateY(-4px)}}
@keyframes bow{0%,100%{transform:none}35%,70%{transform:translateY(6px) scaleY(.9)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px)}}
@keyframes sfx{0%{opacity:0;transform:scale(.3) rotate(-18deg)}20%{opacity:1;transform:scale(1.2) rotate(-10deg)}70%{opacity:1;transform:scale(1) rotate(-10deg)}100%{opacity:0;transform:scale(1.05) rotate(-10deg)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}24%{opacity:1;transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

@keyframes cuepop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes pulse{to{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){
  .stage.shake,.char,.char .bob,.char .garm,.char .eyes,.char.lunge .arm,.audience span,.finale button.live,.cue.go span,.bubble.say{animation:none!important}
  .drape,.char.walk,.char.walk-out{transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="hud-row">
      <div class="stat"><span class="lbl">ネタ</span><b id="round">-</b></div>
      <div class="stat score"><span class="lbl">得点</span><b id="score">0</b></div>
      <div class="stat"><span class="lbl">コンボ</span><b id="combo">0</b></div>
      <button class="mute" id="mute" type="button" aria-label="音を消す">🔊</button>
    </div>
    <div class="laugh"><span class="lbl">客席の笑い</span><div class="meter"><i id="laughFill"></i></div></div>
  </header>

  <main class="stage closed" id="stage" data-move="classic">
    <div class="flash" id="flash"></div>
    <div class="bubbles">
      <div class="bubble boke hide" id="bokeBubble"><span class="who">ボケ</span><p id="bokeText"></p></div>

    <div class="sfx" id="sfx"></div>
    <div class="performers">
      <svg class="char boke-char" id="bokeChar" viewBox="0 0 120 180" aria-hidden="true"></svg>
      <svg class="mic" viewBox="0 0 60 150" aria-hidden="true">
        <defs><linearGradient id="micGold" x1="0" x2="1"><stop offset="0" stop-color="#b8860b"/><stop offset=".5" stop-color="#ffd966"/><stop offset="1" stop-color="#a87400"/></linearGradient></defs>
        <rect x="27" y="40" width="6" height="104" rx="3" fill="url(#micGold)"/>
        <ellipse cx="30" cy="146" rx="20" ry="4" fill="#5a4000"/>
        <rect x="20" y="10" width="20" height="34" rx="10" fill="#2b2b2b"/>
        <rect x="21.5" y="12" width="17" height="20" rx="8.5" fill="#6d6d6d"/>
        <path d="M22 18h16M22 23h16M22 28h16" stroke="#3b3b3b" stroke-width="1.4"/>

    </div>
    <div class="mekuri" id="mekuri"><span id="mekuriText"></span></div>
    <div class="floor"></div>
    <div class="audience" id="audience"></div>
    <div class="popup" id="popup"><div class="rank" id="popRank"></div><div class="pts" id="popPts"></div><div class="note" id="popNote"></div><div class="hint" id="popHint" hidden></div></div>
    <div class="apop" id="apop"><div class="r" id="apRank"></div><div class="n" id="apNote"></div></div>
    <div class="drape l"></div>
    <div class="drape r"></div>
    <div class="valance"></div>
  </main>

  <section class="controls">
    <div class="cue" id="cue"><span id="cueText"></span></div>
    <div class="timer" id="timer"><div class="zones" id="zones"></div><b class="needle" id="needle"></b></div>
    <div class="pad" id="pad" data-mode="none">
      <div class="idle" id="idle"></div>
      <div class="opts" id="opts">
        <button class="opt locked" type="button"></button>
        <button class="opt locked" type="button"></button>
        <button class="opt locked" type="button"></button>
        <button class="opt locked" type="button"></button>
      </div>
      <div class="aiz"><button id="aizBtn" type="button"><small>合いの手</small><b id="aizWord">うん</b></button></div>
      <div class="finale"><button class="locked" id="finaleBtn" type="button">もおええよ！</button></div>
    </div>
  </section>

  <div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
</div>

      drum: (type, s, v) => {

    const beat = 60 / T.bpm;
    const t0 = actx.currentTime + 0.06;
    const at = b => t0 + (b - first) * beat;
    const master = actx.createGain(); master.gain.value = 0.5;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(out);
    const S = makeSynth(master);
    T.parts.forEach(p => {
      const notes = p.notes.filter(n => n[0] >= first);
      if (p.inst === 'theremin'){ S.theremin(notes, at, beat, p.vol); return; }
      notes.forEach(n => (Array.isArray(n[2]) ? n[2] : [n[2]]).forEach(m => S[p.inst](midiHz(m), at(n[0]), n[1] * beat, p.vol)));
    });
    if (T.drums) T.drums((type, b, v) => { if (b >= first) S.drum(type, at(b), v); });

  /* ---------- 声（端末の読み上げ機能） ---------- */
  function speechText(s){
    return s.replace(/（[^）]*）/g, '')
      .replace(/[「」『』・]/g, '')
      .replace(/〜/g, 'ー')
      .replace(/…+/g, '、')

  function charWeight(c){

    if (/[（）「」『』・\s]/.test(c)) return 0.3;
    if (/[ゃゅょャュョぁぃぅぇぉァィゥェォ]/.test(c)) return 0.3;

  const Voice = (() => {
    const synth = window.speechSynthesis;
    const ok = !!synth && typeof window.SpeechSynthesisUtterance === 'function';

    const FEMALE = /kyoko|o-ren|haruka|ayumi|nanami|sayaka|mizuki|google|female|女性/i;
    const keep = new Set();
    let pool = [], males = [], females = [];
    let noJa = false, verified = false, broken = false, fails = 0;
    let wanted = ['m', 'm'];
    const cast = { boke: null, tsuk: null };
    const adj = { boke: 1, tsuk: 1 };
    const isM = v => MALE.test(v.name) && !FEMALE.test(v.name);
    const isF = v => FEMALE.test(v.name) && !MALE.test(v.name);
    function choose(sex, avoid){
      const pref = sex === 'f' ? females : males;
      const v = pref.find(x => x !== avoid) || pref[0] || pool.find(x => x !== avoid) || pool[0] || null;
      let a = 1;

      let all = [];
      try { all = synth.getVoices() || []; } catch (e) { all = []; }
      if (!all.length) return;
      const ja = all.filter(v => /^ja([-_]|$)/i.test(v.lang || ''));
      noJa = ja.length === 0;
      if (noJa) return;
      const local = ja.filter(v => v.localService);
      pool = local.length ? local : ja;
      males = pool.filter(isM);
      females = pool.filter(isF);
      applyCast();
    }
    if (ok){
      pick();
      try { synth.addEventListener('voiceschanged', () => { pick(); onVoiceState(); }); } catch (e) {}
    }

    function setCast(bokeSex, tsukSex){ wanted = [bokeSex, tsukSex]; if (pool.length) applyCast(); }
    function stop(){ if (ok){ try { synth.cancel(); } catch (e) {} } }
    function unlock(){
      if (!enabled()) return;
      try {
        const u = new SpeechSynthesisUtterance('あ');
        u.lang = 'ja-JP'; u.volume = 0; u.rate = 2;
        u.onstart = () => { verified = true; };
        u.onend = u.onerror = () => { keep.delete(u); };
        keep.add(u);

      } catch (e) {}
    }

      const t = speechText(text);
      if (!enabled() || !t) return Promise.resolve(false);
      return new Promise(resolve => {
        let done = false, started = false, probe = 0, guard = 0;
        const u = new SpeechSynthesisUtterance(t);
        const finish = spoke => {
          if (done) return;
          done = true;
          clearTimeout(probe); clearTimeout(guard);
          keep.delete(u);
          resolve(spoke);
        };
        u.lang = 'ja-JP';
        if (cast[who]) u.voice = cast[who];

        u.pitch = clamp(pitch * adj[who], 0.1, 2);
        u.volume = 1;
        u.onstart = () => { started = true; verified = true; fails = 0; clearTimeout(probe); };

    return Voice.status() === 'ok' ? '出囃子・声・効果音が出ます（右上のボタンで消せます）' : 'この端末では読み上げの声が使えないため、出囃子と効果音だけ鳴ります';

  const mouthTimers = new Map();

    mouthOff(ch);

  }
  function mouthOff(ch){
    const t = mouthTimers.get(ch);
    if (t){ clearInterval(t); mouthTimers.delete(ch); }

  }

    if (!Voice.enabled()){ mouthPop(el.tsukChar); return Promise.resolve(); }

  /* ---------- 画面更新 ---------- */
  function hud(bump){

  function setGauge(zones, limit){
    el.zones.textContent = '';
    zones.forEach(z => {
      const i = document.createElement('i');
      i.className = 'z ' + z[1];
      i.style.flex = '0 0 ' + (z[0] / limit * 100).toFixed(2) + '%';

  // 合いの手は「言い終わってひと呼吸」が最適。早すぎても遅すぎても減点
  function aizSpec(gs, ge){
    const yEnd = ge + 0.35, oEnd = yEnd + 0.45, limit = oEnd + 0.6;
    return { gs, ge, yEnd, oEnd, limit, zones: [[0.1, 'o'], [gs - 0.1, 'y'], [ge - gs, 'g', 'ええ間'], [yEnd - ge, 'y'], [oEnd - yEnd, 'o'], [limit - oEnd, 'r']] };
  }
  function setPad(mode){ el.pad.dataset.mode = mode; }
  function setIdle(t){ el.idle.textContent = t; }
  function setOptions(list){
    currentOpts = list ? shuffle(list).map(o => ({ text: o[0], fit: o[1] })) : [];
    el.opts.forEach((b, i) => {
      b.className = list ? 'opt armed' : 'opt locked';
      b.textContent = list ? currentOpts[i].text : '';
    });
  }
  function mouthPop(ch){ ch.classList.add('open'); setTimeout(() => ch.classList.remove('open'), 320); }
  function showTsuk(text){
    el.tsukText.textContent = text;

  async function speak(who, text, speed, id, append, vo){
    const box = who === 'boke' ? el.bokeText : el.tsukText;
    const ch = who === 'boke' ? el.bokeChar : el.tsukChar;
    (who === 'boke' ? el.bokeBubble : el.tsukBubble).classList.remove('hide');
    if (!append) box.textContent = '';
    else if (box.textContent) box.textContent += '\n';
    const o = vo || {};
    const voiced = !o.silent && Voice.enabled();
    const unit = 95 / (o.rate || 1.1);
    let ended = false, voiceDone = null;
    ch.classList.add('talking');
    if (voiced){
      let est = 300;
      for (const c of text) est += charWeight(c) * unit;
      voiceDone = Voice.say(text, who, o.rate || 1.1, o.pitch || 1, est * 1.8 + 1500).then(() => { ended = true; });
      mouthOn(ch);
    }
    let n = 0;
    for (const c of text){
      if (!alive(id)) break;
      box.textContent += c;
      if (voiced){
        if (!ended) await sleep(charWeight(c) * unit);
        continue;
      }
      const quiet = QUIET.test(c);
      if (!quiet) n++;
      ch.classList.toggle('open', !quiet && n % 2 === 1);
      if (!quiet && n % 2 === 1 && !o.silent) blip(who);
      await sleep(c === '、' ? speed * 4 : (PAUSE.test(c) ? speed * 5 : speed));
    }
    if (voiceDone && alive(id)) await voiceDone;
    mouthOff(ch);
    ch.classList.remove('talking');
  }

  function buildAudience(){
    el.audience.textContent = '';
    for (let i = 0; i < AUD_N; i++){ const s = document.createElement('span'); s.textContent = '🙂'; el.audience.appendChild(s); }

  function audience(rank){
    const f = FACES[rank];
    Array.from(el.audience.children).forEach(s => {
      s.textContent = f[Math.floor(Math.random() * f.length)];
      s.classList.remove('jump', 'jump2');
      if (rank >= 2){
        s.style.animationDelay = (Math.random() * 0.18).toFixed(2) + 's';
        void s.offsetWidth;
        s.classList.add(rank === 4 ? 'jump2' : 'jump');

    });
    clearTimeout(audTimer);
    audTimer = setTimeout(settleAudience, 1500);
  }
  function settleAudience(){
    const l = G ? G.laugh : 30;
    const face = l >= 70 ? '😄' : (l >= 35 ? '🙂' : '😐');
    Array.from(el.audience.children).forEach(s => { s.textContent = face; });

  function popup(rank, pts, bonus, note, hint){
    el.popup.style.setProperty('--rank-color', RANKS[rank].color);
    el.popRank.textContent = RANKS[rank].label;
    el.popPts.textContent = '+' + pts + (bonus ? '　' + G.combo + 'コンボ！' : '');

  function miniPopup(rank, pts, bonus, note){
    el.apop.style.setProperty('--rank-color', RANKS[rank].color);
    el.apRank.textContent = RANKS[rank].label + ' +' + pts;
    el.apNote.textContent = note + (bonus ? '（' + G.combo + 'コンボ）' : '');

  function react(rank, bonus, after){
    if (rank > 0){
      restart(el.tsukChar, 'lunge');
      el.bokeChar.classList.remove('hit', 'hit-big');
      restart(el.bokeChar, rank >= 3 ? 'hit-big' : 'hit');
      el.sfx.textContent = RANKS[rank].sfx;
      el.sfx.style.setProperty('--c', RANKS[rank].color);
      restart(el.sfx, 'show');
      slap(0.35 + rank * 0.16);
      if (rank >= 2) (after || sleep(110)).then(() => crowd(rank));
      if (rank === 4){ restart(el.stage, 'shake'); restart(el.flash, 'on'); }
      if (bonus) setTimeout(() => chime(G.combo), 230);
      vibrate(rank >= 3 ? 35 : 15);
    } else {
      boo();
    }
    audience(rank);
  }

  function addScore(kind, rank, mult){
    const aiz = kind === 'aiz';
    const base = (aiz ? AIZ_PTS[rank] : RANKS[rank].pts) * mult;
    const max = (aiz ? AIZ_PTS[4] : RANKS[4].pts) * mult;
    (aiz ? G.aiz : G.tsuk)[rank]++;
    let bonus = 0;
    if (rank >= 3){
      G.combo++;
      if (G.combo > G.maxCombo) G.maxCombo = G.combo;
      if (G.combo >= 2) bonus = aiz ? Math.min(20, (G.combo - 1) * 4) : Math.min(50, (G.combo - 1) * 10);
    } else {
      G.combo = 0;
    }
    const pts = base + bonus;
    G.score += pts;
    G.base += base;
    G.baseMax += max;
    G.laugh = clamp(G.laugh + (aiz ? AIZ_LAUGH[rank] : LAUGH_DELTA[rank]), 0, 100);
    hud(pts > 0);
    return { pts, bonus };
  }

  /* ---------- タップの受付（リアルタイム） ---------- */
  function openWindow(limit, id, mode){
    return new Promise(resolve => {
      const t0 = performance.now();
      win = { t0, limit, id, mode, resolve };
      if (mode === 'finale'){ el.finaleBtn.classList.remove('armed', 'locked'); el.finaleBtn.classList.add('live'); }
      else if (mode === 'aiz') el.aizBtn.classList.add('live');
      else el.opts.forEach(b => { b.classList.remove('armed', 'locked'); b.classList.add('live'); });
      el.timer.classList.add('on');
      setCue(CUE_GO[mode], true);
      const tick = now => {
        if (!win || win.t0 !== t0) return;
        const s = Math.max(0, (now - t0) / 1000);
        el.needle.style.left = Math.min(100, s / limit * 100) + '%';
        if (s >= limit){ closeWindow({ timeout: true, t: limit }); return; }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  function closeWindow(res){
    const w = win;
    if (!w) return;
    win = null;
    el.timer.classList.remove('on');
    el.opts.forEach(b => { b.classList.remove('live', 'armed'); b.classList.add('locked'); });
    el.aizBtn.classList.remove('live');
    el.finaleBtn.classList.remove('live', 'armed');
    el.finaleBtn.classList.add('locked');
    setCue('', false);
    w.resolve(res);
  }
  function pressOption(i){
    const w = win;
    if (w && w.mode === 'opts' && alive(w.id)){ closeWindow({ choice: i, t: (performance.now() - w.t0) / 1000 }); return; }
    const e = early;
    if (e && e.kind === 'opts' && !e.tapAt && alive(e.id)){
      e.tapAt = performance.now();
      e.choice = i;
      el.opts.forEach((b, k) => { b.classList.remove('armed'); b.classList.add('locked'); if (k === i) b.classList.add('picked'); });
    }
  }
  function pressAizuchi(){
    const w = win;
    if (w && w.mode === 'aiz' && alive(w.id)){ closeWindow({ t: (performance.now() - w.t0) / 1000 }); return; }
    const e = early;
    if (e && e.kind === 'aiz' && !e.tapAt && alive(e.id)){
      e.tapAt = performance.now();
      el.aizBtn.classList.add('pressed');
      showTsuk(e.word);
      mouthPop(el.tsukChar);

  }
  function pressFinale(){
    const w = win;
    if (w && w.mode === 'finale' && alive(w.id)){ closeWindow({ t: (performance.now() - w.t0) / 1000 }); return; }
    const e = early;
    if (e && e.kind === 'finale' && !e.tapAt && alive(e.id)){
      e.tapAt = performance.now();
      el.finaleBtn.classList.remove('armed');
      el.finaleBtn.classList.add('pressed');
    }
  }
  // ボケがしゃべっている間の「早押し」を記録しつつ、セリフを最後まで流す
  async function bokeLine(kind, text, o, id, word){
    const e = { id, kind, word: word || '', tapAt: 0, choice: -1 };
    early = e;
    await speak('boke', text, o.speed, id, false, o.voice);
    if (early === e) early = null;
    if (!e.tapAt) return null;
    return { delta: (e.tapAt - performance.now()) / 1000, choice: e.choice };
  }

  /* ---------- 進行 ---------- */
  function roundOpts(r){
    const P = C.pace, V = C.voice.boke;
    return {
      speed: Math.max(P.minSpeed, P.speed - r * P.accel),
      voice: { rate: V.rate + r * (V.step || 0), pitch: V.pitch },
      gs: P.gs + r * P.narrow,
      ge: P.ge - r * P.narrow
    };
  }

  async function aizuchiLine(line, word, o, id){
    const A = aizSpec(o.gs, o.ge);
    el.tsukBubble.classList.add('hide');
    setGauge(A.zones, A.limit);
    el.aizWord.textContent = word;
    el.aizBtn.className = '';
    setPad('aiz');
    setCue('言い終わって、ひと呼吸おいて合いの手', false);
    const pre = await bokeLine('aiz', line, o, id, word);
    if (!alive(id)) return;
    let res;
    if (pre) res = { early: true, delta: pre.delta };
    else {
      res = await openWindow(A.limit, id, 'aiz');
      if (!alive(id) || res.cancel) return;
    }
    setCue('', false);
    let rank, note, voiced = true;
    if (res.early){
      if (res.delta < -EARLY_GRACE){ rank = 1; note = 'かぶった！'; voiced = false; }
      else { rank = 2; note = '食い気味'; }
    } else if (res.timeout){ rank = 0; note = '合いの手なし…'; voiced = false; }
    else if (res.t < 0.1){ rank = 2; note = '早い'; }
    else if (res.t < A.gs){ rank = 3; note = 'ちょい早い'; }
    else if (res.t <= A.ge){ rank = 4; note = 'ええ間！'; }
    else if (res.t <= A.yEnd){ rank = 3; note = 'ちょい遅れ'; }
    else if (res.t <= A.oEnd){ rank = 2; note = '遅い'; }
    else { rank = 1; note = '遅すぎ…'; }
    const sc = addScore('aiz', rank, 1);
    el.aizBtn.classList.remove('pressed', 'live');
    el.aizBtn.classList.add(rank === 4 ? 'hit' : (rank === 3 ? 'meh' : 'bad'));
    if (!res.timeout && !res.early) showTsuk(word);
    const v = voiced ? tsukkomiVoice(word, C.voice.aiz) : Promise.resolve();
    pon(rank);
    miniPopup(rank, sc.pts, sc.bonus, note);
    await Promise.all([sleep(res.timeout ? C.pace.aizAfter + 50 : C.pace.aizAfter), v]);
  }

  function tsukTiming(r){
    const P = C.pace;
    const voiced = Voice.enabled();
    const fast = voiced ? Math.max(P.fastMin, P.fast - r * 0.05) : Math.max(P.fastMin + 0.15, P.fast + 0.2 - r * 0.06);
    const late = fast + P.lateAdd + (voiced ? 0 : 0.1);
    const limit = late + P.limitAdd + (voiced ? 0 : 0.1);
    return { fast, late, limit };
  }

  async function tsukkomiTurn(n, r, o, id){
    const tm = tsukTiming(r);
    el.tsukBubble.classList.add('hide');
    setGauge([[tm.fast, 'g', 'ジャスト'], [tm.late - tm.fast, 'y'], [tm.limit - tm.late, 'r']], tm.limit);
    setOptions(n.opts);
    setPad('opts');
    setCue('ボケが来るで！', false);
    const pre = await bokeLine('opts', n.punch, o, id);
    if (!alive(id)) return;
    let res;
    if (pre) res = { choice: pre.choice, t: 0, early: pre.delta < -EARLY_GRACE };
    else {
      res = await openWindow(tm.limit, id, 'opts');
      if (!alive(id) || res.cancel) return;
    }
    await judge(n, res, tm, id);
  }

  async function judge(n, res, tm, id){
    setCue('', false);
    const best = n.opts.find(o => o[1] === 4)[0];
    let rank, note, said, hint = '';
    if (res.timeout){
      rank = 0; said = '……'; note = '時間切れ…'; hint = '◎「' + best + '」';
    } else {
      const o = currentOpts[res.choice];
      const p = res.early ? 1 : (res.t <= tm.fast ? 0 : (res.t <= tm.late ? 1 : 2));
      said = o.text;
      rank = o.fit <= 0 ? 0 : Math.max(1, o.fit - p);
      note = o.fit <= 0 ? 'ツッコミになってへん！' : FIT_WORD[o.fit] + '／' + (res.early ? '食い気味…' : TIME_WORD[p]);
      if (o.fit < 4) hint = '◎「' + best + '」';
      el.opts[res.choice].classList.add('picked');
    }
    el.opts.forEach((btn, i) => { if (currentOpts[i] && currentOpts[i].fit === 4) btn.classList.add('best'); });
    const sc = addScore('tsuk', rank, 1);
    showTsuk(said);
    const tsukVoice = res.timeout ? Promise.resolve() : tsukkomiVoice(said, C.voice.tsuk.rate);
    react(rank, sc.bonus, tsukVoice);
    popup(rank, sc.pts, sc.bonus, note, hint);
    if (n.why) setCue('ポイント：' + n.why, false);
    await Promise.all([sleep(C.pace.after[0]), tsukVoice]);
    if (!alive(id)) return;
    if (res.timeout) await speak('boke', C.miss[0], 55, id, false, C.voice.boke);
    else if (rank === 0) await speak('boke', C.miss[1], 55, id, false, C.voice.boke);
    if (!alive(id)) return;
    await sleep(C.pace.after[1]);
  }

  async function playNeta(n, r, id, prefix){
    el.round.textContent = (r + 1) + '/' + C.rounds;
    const o = roundOpts(r);
    for (let k = 0; k < n.setup.length; k++){
      const line = (k === 0 ? prefix : '') + n.setup[k][0];
      await aizuchiLine(line, n.setup[k][1], o, id);
      if (!alive(id)) return;
      await sleep(C.pace.line);
      if (!alive(id)) return;
    }
    await tsukkomiTurn(n, r, o, id);
  }

  function placeOff(){
    [el.bokeChar, el.tsukChar].forEach(c => c.classList.remove('walk', 'walk-out', 'bow', 'lunge', 'hit', 'hit-big', 'talking', 'open'));
    el.bokeChar.classList.add('off-l');
    el.tsukChar.classList.add('off-r');
    void el.stage.getBoundingClientRect();
  }
  function walkIn(){
    [el.bokeChar, el.tsukChar].forEach(c => c.classList.add('walk'));
    void el.stage.getBoundingClientRect();
    el.bokeChar.classList.remove('off-l');
    el.tsukChar.classList.remove('off-r');
    setTimeout(() => { [el.bokeChar, el.tsukChar].forEach(c => c.classList.remove('walk')); }, (WALK_MS[C.move] || 3000) + 100);
  }
  function walkOut(){
    [el.bokeChar, el.tsukChar].forEach(c => c.classList.add('walk-out'));
    void el.stage.getBoundingClientRect();
    el.bokeChar.classList.add('off-l');
    el.tsukChar.classList.add('off-r');
  }

  async function entrance(id){
    el.round.textContent = '登場';
    setPad('none');
    setIdle('出囃子にのって登場！');
    setGauge([], 1);
    setCue('', false);
    placeOff();
    el.stage.classList.add('closed');
    const len = playTune(C.tune, 'full');
    await sleep(150);
    if (!alive(id)) return;
    el.stage.classList.remove('closed');
    await sleep(450);
    if (!alive(id)) return;
    applause(3.2, 110);
    await sleep(400);
    if (!alive(id)) return;
    walkIn();
    await sleep(Math.max((WALK_MS[C.move] || 3000) + 500, len * 1000 - 1000));
    if (!alive(id)) return;
    setIdle('');
  }

  async function greeting(id){
    speak('tsuk', C.greet, 44, id, false, { silent: true });
    await speak('boke', C.greet, 48, id, false, C.voice.boke);
    if (!alive(id)) return;
    restart(el.bokeChar, 'bow');
    restart(el.tsukChar, 'bow');
    await sleep(1150);
    el.bokeChar.classList.remove('bow');
    el.tsukChar.classList.remove('bow');
  }

  async function playOpening(id){
    el.round.textContent = 'つかみ';
    const o = roundOpts(0);
    for (const [line, word] of C.opening){
      await aizuchiLine(line, word, o, id);
      if (!alive(id)) return;
      await sleep(C.pace.line);
      if (!alive(id)) return;
    }
  }

  async function playFinale(id){
    el.round.textContent = '締め';
    const o = roundOpts(C.rounds);
    await aizuchiLine(C.closing[0], C.closing[1], o, id);
    if (!alive(id)) return;
    await sleep(C.pace.line);
    if (!alive(id)) return;
    const line = C.finales[Math.floor(Math.random() * C.finales.length)];
    const f = tsukTiming(0).fast;
    el.tsukBubble.classList.add('hide');
    setGauge([[f, 'g', 'ジャスト'], [0.8, 'y'], [1.4, 'r']], f + 2.2);
    el.finaleBtn.className = 'armed';
    setPad('finale');
    setCue('最後のボケや…', false);
    const pre = await bokeLine('finale', line, o, id);
    if (!alive(id)) return;
    let res;
    if (pre) res = { t: 0, early: pre.delta < -EARLY_GRACE };
    else {
      res = await openWindow(f + 2.2, id, 'finale');
      if (!alive(id) || res.cancel) return;
    }
    setCue('', false);
    let rank, note;
    if (res.timeout){ rank = 0; note = '締めそこねた…'; }
    else if (res.early){ rank = 2; note = '食い気味の締め'; }
    else if (res.t <= f){ rank = 4; note = 'キレッキレの締め！'; }
    else if (res.t <= f + 0.8){ rank = 3; note = 'ええ締めや！'; }
    else if (res.t <= f + 1.5){ rank = 2; note = 'ちょい遅れの締め'; }
    else { rank = 1; note = '間があきすぎ…'; }
    const sc = addScore('tsuk', rank, 2);
    showTsuk(res.timeout ? '……' : 'もおええよ！');
    const v = res.timeout ? Promise.resolve() : tsukkomiVoice('もおええよ！', C.voice.tsuk.rate * 0.9);
    react(rank, sc.bonus, v);
    popup(rank, sc.pts, sc.bonus, note + '（締めは2倍）', '');
    await Promise.all([sleep(1300), v]);
    if (!alive(id)) return;
    if (res.timeout){
      await speak('boke', C.stop, 58, id, false, C.voice.boke);
      if (!alive(id)) return;
      await sleep(300);
    }
    setPad('none');
    setIdle('');
    setGauge([], 1);
    speak('tsuk', C.thanks, 44, id, false, { silent: true });
    await speak('boke', C.thanks, 44, id, false, C.voice.boke);
    if (!alive(id)) return;
    restart(el.bokeChar, 'bow');
    restart(el.tsukChar, 'bow');
    playTune(C.tune, 'outro');
    applause(2.6, 90);
    audience(3);
    await sleep(1150);
    if (!alive(id)) return;
    el.bokeChar.classList.remove('bow');
    el.tsukChar.classList.remove('bow');
    el.bokeBubble.classList.add('hide');
    el.tsukBubble.classList.add('hide');
    walkOut();
    await sleep(Math.min(700, WALK_OUT_MS[C.move] || 700));
    if (!alive(id)) return;
    el.stage.classList.add('closed');
    await sleep(1300);
  }

  async function startGame(comboId){
    C = COMBOS.find(c => c.id === comboId) || C;
    audioInit();
    Voice.stop();
    Voice.setCast(C.look.boke.sex, C.look.tsuk.sex);
    Voice.unlock();
    if (win){ const w = win; win = null; w.resolve({ cancel: true }); }
    early = null;
    const id = ++runId;
    G = { score: 0, base: 0, baseMax: 0, combo: 0, maxCombo: 0, laugh: 30, aiz: [0, 0, 0, 0, 0], tsuk: [0, 0, 0, 0, 0] };
    el.overlay.classList.add('hidden');
    el.bokeBubble.classList.add('hide');
    el.tsukBubble.classList.add('hide');
    mouthOff(el.bokeChar);
    mouthOff(el.tsukChar);
    el.stage.classList.add('closed');
    applyCombo();
    hud(false);
    setOptions(null);
    settleAudience();
    await entrance(id);
    if (!alive(id)) return;
    await greeting(id);
    if (!alive(id)) return;
    await playOpening(id);
    if (!alive(id)) return;
    const set = shuffle(C.netas).slice(0, C.rounds);
    const trans = shuffle(C.transitions);
    for (let r = 0; r < C.rounds; r++){
      if (!alive(id)) return;
      await playNeta(set[r], r, id, r === 0 ? '' : trans[(r - 1) % trans.length]);
    }
    if (!alive(id)) return;
    await playFinale(id);
    if (!alive(id)) return;
    showResult();
  }

  /* ---------- タイトル（コンビ選び）・結果 ---------- */
  function chipsHTML(textFn){
    return [4, 3, 2, 1, 0].map(r => '<span class="chip" style="--c:' + RANKS[r].color + ';--ci:' + RANKS[r].ink + '">' + textFn(r) + '</span>').join('');
  }
  function comboCard(c){
    const best = loadBest(c.id);
    return '<button class="combo" type="button" data-id="' + c.id + '" style="--cc:' + c.look.boke.suit + ';--cc2:' + c.look.tsuk.suit + '">' +
      '<span class="sw"><i></i><i></i></span>' +
      '<span class="cb">' +
        '<span class="cn">' + c.name + '</span>' +
        '<span class="cm"><span class="tag">' + c.style + '</span><span class="lv" aria-label="むずかしさ' + c.level + '">' + '★'.repeat(c.level) + '☆'.repeat(3 - c.level) + '</span></span>' +
        '<span class="cd">' + c.desc + '</span>' +
        (best ? '<span class="cs">ハイスコア ' + fmt(best) + '点</span>' : '') +
      '</span></button>';
  }
  function showTitle(){
    el.panel.innerHTML =
      '<h1 class="sign">ツッコミ漫才</h1>' +
      '<p class="lead">相方を選んだら、出囃子とともに開演。<br>合いの手とツッコミで、漫才を成立させよう！</p>' +
      '<details class="howto"><summary>遊び方</summary><div class="rules">' +
        '<p><b>合いの手</b>　相方が言い終わってから、ひと呼吸おいてタップ。ゲージの緑が「ええ間」で、早すぎても遅すぎても減点。</p>' +
        '<p><b>ツッコミ</b>　ボケたらツッコミが4つ出る。いちばん合うのを、すかさずタップ。</p>' +
        '<div class="chips">' + chipsHTML(r => RANKS[r].short) + '</div>' +
        '<p>どちらも5段階評価（ツッコミは最高100点、合いの手は最高50点）。最後は「もおええよ！」で締め（得点2倍）。</p>' +
        '<p>★が多いコンビほどボケがむずかしく、正解のツッコミがわかりにくくなります。</p>' +
      '</div></details>' +
      '<p class="pick">コンビを選ぶ</p>' +
      '<div class="combos">' + COMBOS.map(comboCard).join('') + '</div>' +
      '<p class="best-line" id="soundNote">' + soundNoteText() + '</p>';
    el.panel.querySelectorAll('.combo').forEach(b => b.addEventListener('click', () => startGame(b.dataset.id)));
    el.overlay.classList.remove('hidden');
    el.overlay.scrollTop = 0;
  }
  function showResult(){
    const s = G.score;
    const ratio = G.baseMax ? G.base / G.baseMax : 0;
    const title = TITLES.find(t => ratio >= t[0])[1];
    const prev = loadBest(C.id);
    const isNew = s > prev;
    if (isNew) store(BEST_PREFIX + C.id, String(s));
    el.panel.innerHTML =
      '<p class="done">' + C.name + '　本日の漫才、これにて終演</p>' +
      '<h2 class="honor">' + title + '</h2>' +
      '<div class="big-score">' + fmt(s) + '<small>点</small></div>' +
      (isNew ? '<p class="new">ハイスコア更新！</p>' : '<p class="rec">ハイスコア ' + fmt(prev) + '点</p>') +
      '<p class="row-label">ツッコミ</p>' +
      '<div class="chips">' + chipsHTML(r => RANKS[r].short + ' ×' + G.tsuk[r]) + '</div>' +
      '<p class="row-label">合いの手</p>' +
      '<div class="chips">' + chipsHTML(r => RANKS[r].short + ' ×' + G.aiz[r]) + '</div>' +
      '<p class="sub">最大コンボ ' + G.maxCombo + ' ／ 客席の笑い ' + Math.round(G.laugh) + '%</p>' +
      '<div class="btns"><button class="big" id="again" type="button">もう一回</button><button class="big ghost" id="toPick" type="button">コンビを選ぶ</button></div>';
    $('again').addEventListener('click', () => startGame(C.id));
    $('toPick').addEventListener('click', showTitle);
    el.overlay.classList.remove('hidden');
    el.overlay.scrollTop = 0;
  }

  /* ---------- 入力 ---------- */
  function bindPress(node, fn){
    node.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; fn(); });
    node.addEventListener('click', fn);
  }
  el.opts.forEach((b, i) => bindPress(b, () => pressOption(i)));
  bindPress(el.aizBtn, pressAizuchi);
  bindPress(el.finaleBtn, pressFinale);
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    const mode = el.pad.dataset.mode;
    if (mode === 'opts' && e.key >= '1' && e.key <= '4'){ e.preventDefault(); pressOption(Number(e.key) - 1); }
    else if ((e.key === ' ' || e.key === 'Enter') && (mode === 'aiz' || mode === 'finale')){
      e.preventDefault();
      if (mode === 'aiz') pressAizuchi(); else pressFinale();
    }
  });
  function syncMute(){
    el.mute.textContent = muted ? '🔇' : '🔊';
    el.mute.setAttribute('aria-label', muted ? '音を出す' : '音を消す');
  }
  el.mute.addEventListener('click', () => {
    muted = !muted;
    store(MUTE_KEY, muted ? '1' : '0');
    syncMute();
    if (out) out.gain.value = muted ? 0 : 1;
    if (muted) Voice.stop();
    else { audioInit(); Voice.unlock(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.stop(); });

  buildAudience();
  syncMute();
  applyCombo();
  setGauge([], 1);
  setPad('none');
  setIdle('');
  showTitle();
})();
</script>
</body>
</html>
